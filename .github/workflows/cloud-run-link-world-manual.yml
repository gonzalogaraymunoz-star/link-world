name: LINK WORLD · Cloud Run (manual, private)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify AI Studio source exists
        run: |
          test -f apps/link-world-ai-studio/Dockerfile
          test -f apps/link-world-ai-studio/package.json
          test -d apps/link-world-ai-studio/src

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy staging service to Cloud Run (private)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          : "${PROJECT_ID:?Configure GitHub Actions secret GCP_PROJECT_ID}"
          gcloud run deploy link-world-staging \
            --project "${PROJECT_ID}" \
            --region southamerica-west1 \
            --source apps/link-world-ai-studio \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --no-allow-unauthenticated \
            --quiet
