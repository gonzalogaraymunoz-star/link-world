name: LINK WORLD build-only check
on:
  push:
    branches: [feature/director-api-only-persistent]
jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: node --check src/ai/directorChat.js
      - run: node --check api/director.js
      - run: npm run build
